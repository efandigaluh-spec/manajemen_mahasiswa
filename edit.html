<!DOCTYPE html>
<html>
<head>

    <title>Edit Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background: linear-gradient(to right, #1e3c72, #2a5298);">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>✏️ Edit Data Mahasiswa</h3>

        </div>

        <div class="card-body">

            <form action="/update/{{ mahasiswa.id }}"
                  method="POST">

                <div class="mb-3">

                    <input type="text"
                           name="nim"
                           class="form-control"
                           value="{{ mahasiswa.nim }}">

                </div>

                <div class="mb-3">

                    <input type="text"
                           name="nama"
                           class="form-control"
                           value="{{ mahasiswa.nama }}">

                </div>

                <div class="mb-3">

                    <input type="text"
                           name="jurusan"
                           class="form-control"
                           value="{{ mahasiswa.jurusan }}">

                </div>

                <button class="btn btn-primary">

                    Update Data

                </button>

                <a href="/"
                   class="btn btn-secondary">

                   Kembali

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
